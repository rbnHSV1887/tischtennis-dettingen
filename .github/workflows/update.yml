name: Ergebnisse aktualisieren & Seite veröffentlichen

on:
  schedule:
    # alle 2 Stunden (Zeiten in UTC); GitHub startet geplante Läufe manchmal ein paar Minuten später
    - cron: "17 */2 * * *"
  workflow_dispatch:      # Knopf "Run workflow" für sofortiges Aktualisieren
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Homepage aus src/page.html bauen
        run: python build.py

      - name: Daten aus click-TT holen
        run: python scraper/fetch_clicktt.py

      - name: Geänderte Daten speichern
        run: |
          git config user.name "tt-bot"
          git config user.email "tt-bot@users.noreply.github.com"
          git add site/data.json site/index.html
          git diff --cached --quiet || git commit -m "Ergebnisse aktualisiert" && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
